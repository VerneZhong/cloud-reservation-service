spring:
  application:
    name: reservation-api

  datasource:
    url: jdbc:postgresql://localhost:5432/reservation
    username: reservation
    password: reservation

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
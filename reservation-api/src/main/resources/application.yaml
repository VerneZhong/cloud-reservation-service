spring:
  application:
    name: reservation-api

  datasource:
    url: jdbc:postgresql://localhost:5432/reservation
    username: postgres
    password: reservation

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
